name: Deploy to Cloudflare Pages

on:
  push:
    # main deploys production; any other branch gets a Cloudflare preview
    # (<branch>.<project>.pages.dev) after the same build and gates.
    branches: ['**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    # The `secrets` context is not allowed in `if:` expressions, so map it to
    # env here (where it is allowed) and test that below.
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Runs astro build + the sanitization gate. If a forbidden token
      # (employer name, phone, private IP, hostname) reaches dist/ or the
      # resume source, the gate exits non-zero and the deploy never happens.
      - run: npm run build
        env:
          # Private half of the sanitize gate's token list (kept out of the repo).
          SANITIZE_FORBIDDEN: ${{ secrets.SANITIZE_FORBIDDEN }}

      # Two Pages projects serve the site: ethanjustice.pages.dev (canonical)
      # and portfolio-vmy.pages.dev (older alias). Deploy the same build to both.
      - name: Deploy (ethanjustice)
        if: env.HAS_CF_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name ethanjustice --branch ${{ github.ref_name }} --commit-hash ${{ github.sha }}

      - name: Deploy (portfolio alias)
        if: env.HAS_CF_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name portfolio --branch ${{ github.ref_name }} --commit-hash ${{ github.sha }}

      - name: Deploy skipped (no API token)
        if: env.HAS_CF_TOKEN != 'true'
        run: |
          echo "::warning::Build and sanitize gate passed, but CLOUDFLARE_API_TOKEN is not set, so nothing was deployed."
          echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings > Secrets and variables > Actions to enable auto-deploy on push."
